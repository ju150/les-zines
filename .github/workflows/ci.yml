# Intégration continue : rien ne part en production sans passer ces contrôles.
# Un push sur `main` est déployé par Cloudflare Workers Builds ; ce workflow rejoue,
# sur chaque push et chaque pull request, ce que `npm run verify` fait en local.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Typage, tests, build, audit SEO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typage (astro check)
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit SEO du build
        run: npm run audit:seo

  secrets:
    name: Aucun secret dans l'historique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique : un secret effacé du code reste lisible dans un ancien commit
      - name: Installer gitleaks 8.30.1 (somme de contrôle vérifiée)
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl -sSfL -o gitleaks.tar.gz "$base/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_8.30.1_checksums.txt"
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scanner tous les commits
        run: ./gitleaks git --redact --no-banner --verbose .
