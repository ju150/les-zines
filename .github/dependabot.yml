# Mises à jour des dépendances : une pull request groupée par mois et par écosystème,
# que la CI valide avant toute fusion (un push sur main part en production).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      dependances:
        patterns: ['*']
        update-types: [minor, patch]
    # Une version majeure (Tailwind 4, TypeScript 7…) demande une migration : elle se fait à
    # la main, sur une branche, pas par une pull request automatique vouée à échouer.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
